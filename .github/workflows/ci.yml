name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: swift build + test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  demo-app:
    name: NudgeOnDemo (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build NudgeOnDemo + NSE for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Examples/NudgeOnDemo/NudgeOnDemo.xcodeproj \
            -scheme NudgeOnDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
